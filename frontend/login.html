<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | HabitForge</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top right,
                    #2a2105,
                    #080808 45%
                );

            color: #fff;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
        }

        .brand {
            text-align: center;
            color: #d4af37;
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
        }

        .login-card {
            background: rgba(15, 15, 15, .97);
            border: 1px solid #303030;
            border-radius: 20px;
            padding: 35px;

            box-shadow:
                0 20px 70px rgba(0,0,0,.5);
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 28px;
        }

        .form-label {
            color: #bbb;
            font-weight: 600;
        }

        .form-control {
            background: #181818;
            border: 1px solid #303030;
            color: #fff;
            padding: 12px 14px;
            border-radius: 10px;
        }

        .form-control:focus {
            background: #181818;
            color: #fff;
            border-color: #d4af37;

            box-shadow:
                0 0 0 .2rem rgba(212,175,55,.12);
        }

        .form-control::placeholder {
            color: #666;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
        }

        .toggle-password:hover {
            color: #d4af37;
        }

        .btn-gold {
            width: 100%;
            background: #d4af37;
            color: #080808;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-weight: 800;
            margin-top: 10px;
        }

        .btn-gold:hover {
            background: #e4c354;
            color: #080808;
        }

        .forgot {
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #888;
        }

        .register-link a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 700;
        }

        .message {
            display: none;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #102414;
            border: 1px solid #245b2d;
            color: #7ee58b;
        }

        .message.error {
            display: block;
            background: #291010;
            border: 1px solid #612525;
            color: #ff8585;
        }

        .demo-note {
            text-align: center;
            color: #555;
            font-size: 12px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="brand">
        <i class="bi bi-lightning-charge-fill"></i>
        HabitForge
    </div>

    <div class="brand-subtitle">
        Smart Habit & Productivity Management
    </div>

    <div class="login-card">

        <div class="title">
            Welcome Back
        </div>

        <div class="subtitle">
            Login to continue managing your habits.
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="mb-2">

                <label class="form-label">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                    <i
                        class="bi bi-eye toggle-password"
                        id="togglePassword"
                    ></i>

                </div>

            </div>

            <div class="text-end mb-3">

                <a
                    href="#"
                    id="forgotPassword"
                    class="forgot"
                >
                    Forgot Password?
                </a>

            </div>

            <button
                type="submit"
                class="btn btn-gold"
                id="loginBtn"
            >
                <i class="bi bi-box-arrow-in-right"></i>
                Login
            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>

    <div class="demo-note">
        HabitForge Productivity Management System
    </div>

</div>

<script>

    const API =
        "https://habitforge-server-k8gd.onrender.com";


    const loginForm =
        document.getElementById("loginForm");


    const message =
        document.getElementById("message");


    const loginBtn =
        document.getElementById("loginBtn");


    const password =
        document.getElementById("password");


    const togglePassword =
        document.getElementById("togglePassword");


    const forgotPassword =
        document.getElementById("forgotPassword");


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;
    }


    togglePassword.addEventListener(
        "click",
        () => {

            if (
                password.type === "password"
            ) {

                password.type = "text";

                togglePassword.classList.remove(
                    "bi-eye"
                );

                togglePassword.classList.add(
                    "bi-eye-slash"
                );

            } else {

                password.type = "password";

                togglePassword.classList.remove(
                    "bi-eye-slash"
                );

                togglePassword.classList.add(
                    "bi-eye"
                );
            }

        }
    );


    loginForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const email =
                document.getElementById("email")
                    .value
                    .trim();


            const passwordValue =
                password.value;


            if (
                !email ||
                !passwordValue
            ) {

                showMessage(
                    "Please enter your email and password.",
                    "error"
                );

                return;
            }


            loginBtn.disabled = true;

            loginBtn.innerHTML =
                `<span class="spinner-border spinner-border-sm"></span>
                 Logging in...`;


            try {

                const response =
                    await fetch(
                        `${API}/api/auth/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                password:
                                    passwordValue
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Login failed."
                    );
                }


                /*
                    IMPORTANT FIX

                    Server returns:

                    data.user.id

                    Dashboard expects:

                    user._id

                    So we create a consistent
                    local user object here.
                */

                const loggedInUser = {

                    _id:
                        data.user.id,

                    id:
                        data.user.id,

                    name:
                        data.user.name,

                    email:
                        data.user.email
                };


                localStorage.setItem(
                    "habitforgeUser",
                    JSON.stringify(
                        loggedInUser
                    )
                );


                localStorage.setItem(
                    "habitforgeLastActivity",
                    Date.now().toString()
                );


                showMessage(
                    "Login successful! Redirecting...",
                    "success"
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "index.html";

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to connect to server.",
                    "error"
                );


                loginBtn.disabled =
                    false;


                loginBtn.innerHTML =
                    `<i class="bi bi-box-arrow-in-right"></i>
                     Login`;
            }

        }
    );


    forgotPassword.addEventListener(
        "click",
        event => {

            event.preventDefault();

            showMessage(
                "Password recovery will be available soon.",
                "success"
            );

        }
    );

</script>

</body>
</html>
