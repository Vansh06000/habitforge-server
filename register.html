<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HabitForge - Create Account</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 15px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            margin: 0;
            color: #c8a43a;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .brand p {
            margin-top: 10px;
            color: #858585;
            font-size: 16px;
        }

        .register-card {
            background: #0a0a0a;
            border: 1px solid #302817;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        }

        .form-label {
            color: #d5d5d5;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .form-control {
            background: #101010;
            color: #ffffff;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 13px 14px;
        }

        .form-control:focus {
            background: #101010;
            color: #ffffff;
            border-color: #c8a43a;
            box-shadow: 0 0 0 0.2rem rgba(200, 164, 58, 0.12);
        }

        .form-control::placeholder {
            color: #666666;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;
            color: #777777;
            cursor: pointer;
        }

        .password-toggle:hover {
            color: #c8a43a;
        }

        .gold-button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;

            background: #c8a43a;
            color: #050505;

            font-size: 16px;
            font-weight: 700;

            transition: 0.2s ease;
        }

        .gold-button:hover {
            background: #dfbd55;
            transform: translateY(-1px);
        }

        .gold-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #777777;
        }

        .login-link a {
            color: #c8a43a;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .message {
            display: none;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: rgba(180, 40, 40, 0.12);
            border: 1px solid rgba(220, 80, 80, 0.35);
            color: #ff9b9b;
        }

        .message.success {
            display: block;
            background: rgba(70, 150, 80, 0.12);
            border: 1px solid rgba(90, 180, 100, 0.35);
            color: #9be0a1;
        }

        .security-note {
            margin-top: 20px;
            text-align: center;
            color: #5e5e5e;
            font-size: 12px;
        }

        @media (max-width: 500px) {

            .register-card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 36px;
            }
        }

    </style>
</head>

<body>

    <div class="register-wrapper">

        <!-- Brand -->
        <div class="brand">

            <h1>HabitForge</h1>

            <p>
                Create your account and start building better habits.
            </p>

        </div>


        <!-- Register Card -->
        <div class="register-card">

            <div id="messageBox" class="message"></div>

            <form id="registerForm">

                <!-- Full Name -->
                <div class="mb-3">

                    <label
                        for="fullName"
                        class="form-label"
                    >
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="mb-4">

                    <label
                        for="confirmPassword"
                        class="form-label"
                    >
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="confirmPasswordToggle"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Create Account -->
                <button
                    type="submit"
                    class="gold-button"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>


            <!-- Login -->
            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>


            <div class="security-note">

                <i class="bi bi-shield-check"></i>
                Your account information is protected.

            </div>

        </div>

    </div>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const passwordToggle =
            document.getElementById("passwordToggle");

        const confirmPasswordToggle =
            document.getElementById("confirmPasswordToggle");

        const messageBox =
            document.getElementById("messageBox");

        const registerButton =
            document.getElementById("registerButton");


        // Show / hide password
        passwordToggle.addEventListener("click", () => {

            if (password.type === "password") {

                password.type = "text";

                passwordToggle.innerHTML =
                    '<i class="bi bi-eye-slash"></i>';

            } else {

                password.type = "password";

                passwordToggle.innerHTML =
                    '<i class="bi bi-eye"></i>';

            }

        });


        // Show / hide confirm password
        confirmPasswordToggle.addEventListener("click", () => {

            if (confirmPassword.type === "password") {

                confirmPassword.type = "text";

                confirmPasswordToggle.innerHTML =
                    '<i class="bi bi-eye-slash"></i>';

            } else {

                confirmPassword.type = "password";

                confirmPasswordToggle.innerHTML =
                    '<i class="bi bi-eye"></i>';

            }

        });


        function showMessage(message, type) {

            messageBox.textContent = message;

            messageBox.className =
                "message " + type;

        }


        registerForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const fullName =
                document.getElementById("fullName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const passwordValue =
                password.value;

            const confirmPasswordValue =
                confirmPassword.value;


            // Basic validation
            if (!fullName || !email || !passwordValue) {

                showMessage(
                    "Please fill in all required fields.",
                    "error"
                );

                return;
            }


            if (passwordValue.length < 6) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }


            if (passwordValue !== confirmPasswordValue) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            registerButton.disabled = true;

            registerButton.textContent =
                "Creating Account...";


            try {

                /*
                    This URL will be replaced with our
                    final public AWD API URL after deployment.

                    During local development:
                    https://habitforge-server-k8gd.onrender.com
                */

                const response = await fetch(
                    "https://habitforge-server-k8gd.onrender.com/api/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            name: fullName,
                            email: email,
                            password: passwordValue

                        })

                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Unable to create account.",
                        "error"
                    );

                    return;
                }


                showMessage(
                    "Account created successfully. Redirecting to login...",
                    "success"
                );


                registerForm.reset();


                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1200);


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );

                showMessage(
                    "Could not connect to the server. Please make sure the API is running.",
                    "error"
                );

            } finally {

                registerButton.disabled = false;

                registerButton.textContent =
                    "Create Account";

            }

        });

    </script>

</body>
</html>
