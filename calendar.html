<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar | HabitForge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #0d0d0d;
            border-right: 1px solid #292929;
            padding: 25px 15px;
        }

        .brand {
            color: #d4af37;
            font-size: 25px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 35px;
        }

        .nav-link {
            color: #aaa;
            padding: 13px 15px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #19150a;
            color: #d4af37;
        }

        .nav-link i {
            margin-right: 12px;
        }

        .main {
            margin-left: 250px;
            padding: 30px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 800;
        }

        .gold {
            color: #d4af37;
        }

        .subtitle {
            color: #888;
        }

        .calendar-card {
            background: #101010;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 25px;
        }

        .month-title {
            font-size: 25px;
            font-weight: 800;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .weekday {
            text-align: center;
            color: #888;
            font-weight: 700;
            font-size: 13px;
            padding: 10px 0;
        }

        .calendar-day {
            min-height: 90px;
            background: #181818;
            border: 1px solid #282828;
            border-radius: 10px;
            padding: 10px;
            position: relative;
        }

        .calendar-day.empty {
            background: transparent;
            border-color: transparent;
        }

        .calendar-day.today {
            border: 1px solid #d4af37;
        }

        .day-number {
            font-weight: 800;
        }

        .completion-count {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }

        .completion-dot {
            width: 8px;
            height: 8px;
            background: #d4af37;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .legend {
            color: #999;
            font-size: 13px;
        }

        @media(max-width: 800px) {

            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .calendar-day {
                min-height: 65px;
                padding: 7px;
            }

            .completion-count {
                margin-top: 10px;
                font-size: 10px;
            }
        }

        @media(max-width: 500px) {

            .calendar-grid {
                gap: 4px;
            }

            .calendar-day {
                min-height: 55px;
            }

            .weekday {
                font-size: 10px;
            }

            .completion-count {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">

    <div class="brand">
        <i class="bi bi-lightning-charge-fill"></i> HabitForge
    </div>

    <a href="index.html" class="nav-link">
        <i class="bi bi-grid"></i> Dashboard
    </a>

    <a href="habits.html" class="nav-link">
        <i class="bi bi-check2-square"></i> My Habits
    </a>

    <a href="goals.html" class="nav-link">
        <i class="bi bi-bullseye"></i> Goals
    </a>

    <a href="tracking.html" class="nav-link">
        <i class="bi bi-bar-chart"></i> Tracking
    </a>

    <a href="calendar.html" class="nav-link active">
        <i class="bi bi-calendar3"></i> Calendar
    </a>

    <a href="profile.html" class="nav-link">
        <i class="bi bi-person"></i> Profile
    </a>

    <a href="index.html#help" class="nav-link">
        <i class="bi bi-question-circle"></i> Help
    </a>

    <a href="#" class="nav-link" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>

</div>

<div class="main">

    <div class="mb-4">
        <div class="page-title">
            Habit <span class="gold">Calendar</span>
        </div>

        <div class="subtitle">
            View your habit completion history by date.
        </div>
    </div>

    <div class="calendar-card">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <button class="btn btn-outline-light" id="prevMonth">
                <i class="bi bi-chevron-left"></i>
            </button>

            <div class="month-title" id="monthTitle">
                Loading...
            </div>

            <button class="btn btn-outline-light" id="nextMonth">
                <i class="bi bi-chevron-right"></i>
            </button>

        </div>

        <div class="calendar-grid">

            <div class="weekday">Sun</div>
            <div class="weekday">Mon</div>
            <div class="weekday">Tue</div>
            <div class="weekday">Wed</div>
            <div class="weekday">Thu</div>
            <div class="weekday">Fri</div>
            <div class="weekday">Sat</div>

        </div>

        <div class="calendar-grid" id="calendarDays"></div>

        <div class="legend mt-4">
            <span class="completion-dot"></span>
            Number of habit completions for that date
        </div>

    </div>

</div>

<script src="session.js"></script>

<script>
    const API = "https://habitforge-server-k8gd.onrender.com";

    const user = JSON.parse(localStorage.getItem("habitforgeUser"));

    if (!user || !user._id) {
        window.location.href = "login.html";
    }

    let habits = [];

    let currentMonth = new Date();

    async function loadHabits() {

        try {

            const response = await fetch(
                `${API}/api/habits?userId=${user._id}`
            );

            habits = await response.json();

            if (!Array.isArray(habits)) {
                habits = [];
            }

            renderCalendar();

        } catch (error) {

            console.error(error);

            document.getElementById("calendarDays").innerHTML = `
                <div style="grid-column:1/-1;text-align:center;color:#888;padding:40px;">
                    Unable to load habit data.
                </div>
            `;
        }
    }

    function formatDate(year, month, day) {

        return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function getCompletionCount(dateKey) {

        let count = 0;

        habits.forEach(habit => {

            const dates = Array.isArray(habit.completedDates)
                ? habit.completedDates
                : [];

            if (dates.includes(dateKey)) {
                count++;
            }
        });

        return count;
    }

    function renderCalendar() {

        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();

        document.getElementById("monthTitle").textContent =
            currentMonth.toLocaleDateString("en-IN", {
                month: "long",
                year: "numeric"
            });

        const container =
            document.getElementById("calendarDays");

        container.innerHTML = "";

        const firstDay =
            new Date(year, month, 1).getDay();

        const daysInMonth =
            new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {

            const empty = document.createElement("div");

            empty.className = "calendar-day empty";

            container.appendChild(empty);
        }

        const todayKey = formatDate(
            new Date().getFullYear(),
            new Date().getMonth(),
            new Date().getDate()
        );

        for (let day = 1; day <= daysInMonth; day++) {

            const dateKey =
                formatDate(year, month, day);

            const count =
                getCompletionCount(dateKey);

            const cell =
                document.createElement("div");

            cell.className = "calendar-day";

            if (dateKey === todayKey) {
                cell.classList.add("today");
            }

            cell.innerHTML = `
                <div class="day-number">
                    ${day}
                </div>

                ${
                    count > 0
                    ? `
                        <div class="completion-count">
                            <span class="completion-dot"></span>
                            ${count} completed
                        </div>
                    `
                    : `
                        <div class="completion-count">
                            No completion
                        </div>
                    `
                }
            `;

            container.appendChild(cell);
        }
    }

    document.getElementById("prevMonth")
        .addEventListener("click", () => {

            currentMonth.setMonth(
                currentMonth.getMonth() - 1
            );

            renderCalendar();
        });

    document.getElementById("nextMonth")
        .addEventListener("click", () => {

            currentMonth.setMonth(
                currentMonth.getMonth() + 1
            );

            renderCalendar();
        });

    document.getElementById("logoutBtn")
        .addEventListener("click", e => {

            e.preventDefault();

            localStorage.removeItem("habitforgeUser");
            localStorage.removeItem("habitforgeLastActivity");

            window.location.href = "login.html";
        });

    loadHabits();
</script>

</body>
</html>
